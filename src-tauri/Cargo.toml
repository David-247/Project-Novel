[package]
name = "novel"
version = "0.1.0"
description = "Novel - a desktop novel-writing app"
license = "MIT"
edition = "2021"

[lib]
name = "novel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
fontdb = "0.24"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-sql = { version = "2.6.0", features = ["sqlite"] }
tempfile = "3.27.0"
