# cargo-deny configuration: license gate for Rust crates (CI: `cargo deny check licenses`).
# Every crate must be MIT-compatible (no GPL/AGPL/proprietary). MPL-2.0 is file-level copyleft and
# is allowed for crates used unmodified (listed in README "Licenses").

[graph]
# Desktop targets Novel ships for.
targets = [
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
]
all-features = false

[licenses]
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "0BSD",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
  "Unlicense",
  "BSL-1.0",
]
confidence-threshold = 0.9
# Our own crate.
private = { ignore = true }
