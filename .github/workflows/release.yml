name: Release builds

# Builds the desktop app for macOS (universal: Apple silicon + Intel) and Windows (MSI + setup .exe).
# - Pull requests that touch this file: build only, installers uploaded as workflow artifacts.
# - A pushed tag v* or a manual run (Actions tab / `gh workflow run release.yml -f tag=v0.1.0`):
#   build and publish the installers to a GitHub pre-release for that tag.
# Builds are not code-signed yet, so macOS Gatekeeper and Windows SmartScreen warn on first launch
# (the release notes below explain how to open them).
# Third-party actions are pinned to commit SHAs because this job holds a write token.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update (e.g. v0.1.0)
        required: true
  pull_request:
    paths: ['.github/workflows/release.yml']

permissions:
  contents: read

jobs:
  build:
    # tauri-action creates the release and uploads the installers to it.
    permissions:
      contents: write
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - name: Windows x64
            os: windows-latest
            rust-targets: ''
            args: ''
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || (github.ref_type == 'tag' && github.ref_name || '') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: release-${{ matrix.os }}
      - run: pnpm install --frozen-lockfile

      # Runs `pnpm build` (beforeBuildCommand) then `tauri build`. With a tag it also creates the
      # pre-release (if missing) and uploads the installers to it; without one it only builds.
      - name: Build app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Novel ${{ env.RELEASE_TAG }}
          releaseDraft: false
          prerelease: true
          releaseCommitish: ${{ github.sha }}
          releaseBody: |
            Test build of Novel for macOS (Apple silicon and Intel) and Windows.

            **Downloads**
            - macOS: `Novel_*_universal.dmg`. Open it and drag Novel to Applications.
            - Windows: `Novel_*_x64-setup.exe` (or the `.msi`).

            **These builds are not code-signed yet.**
            - macOS: the first time, right-click Novel in Applications and choose **Open**, then **Open** again. If macOS says the app is damaged, run `xattr -cr /Applications/Novel.app` in Terminal.
            - Windows: if SmartScreen appears, click **More info**, then **Run anyway**.

      - name: Upload installers
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: novel-${{ matrix.os }}
          path: |
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
