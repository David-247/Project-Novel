name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Playwright starts its own server (no reuse) and enables retries + the HTML report.
  CI: 'true'

jobs:
  checks:
    name: Lint, typecheck, unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Production web bundle must not contain the e2e-only fake Tauri backend.
      - run: pnpm build
      - run: pnpm verify:prod-bundle

  licenses:
    name: License gate (JS + Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Every JS dependency (prod + dev) must be on the MIT-compatible allowlist.
      - name: JS licenses (pnpm licenses list + allowlist)
        run: node scripts/check-licenses.mjs
      # Rust crates: allowlist in src-tauri/deny.toml.
      - name: Rust licenses (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check licenses

  rust:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      # The Typst PDF sidecar and bundled fonts (pinned, SHA-256 verified): tauri-build copies them at
      # compile time, so every cargo build needs them. The downloaded archives are cached.
      - name: Cache Typst sidecar and fonts
        uses: actions/cache@v4
        with:
          path: .cache/sidecar
          key: sidecar-${{ runner.os }}-${{ hashFiles('scripts/fetch-typst.mjs') }}
      - name: Fetch Typst sidecar and fonts
        run: node scripts/fetch-typst.mjs
      # tauri::generate_context! embeds ../dist at compile time.
      - run: pnpm build
      # Hello-world PDF with the bundled fallback font, the offline guarantees (package import refused,
      # no fetch with the network blocked), timeout, cancel and temp cleanup: src-tauri/src/export/tests.rs.
      - name: Typst sidecar smoke (export tests)
        run: cargo test --locked "export::"
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri

  e2e:
    name: Playwright e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      # Functional projects: chromium (stands in for WebView2) and webkit (for WKWebView). Perf runs
      # in its own job, so its numbers are published even when a functional test fails.
      # Includes e2e/pagination-fixture.spec.ts, which writes the cross-engine page-break JSONs
      # (perf-results/pagination-fixture-<browser>-<platform>.json) compared by the job below.
      - run: pnpm exec playwright test --project=chromium --project=webkit --project=chromium-scroll --project=webkit-scroll
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - name: Upload pagination fixture results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pagination-fixture-${{ matrix.os }}
          path: perf-results/pagination-fixture-*.json
          if-no-files-found: error
          retention-days: 90

  pagination-compare:
    name: Cross-engine page breaks (WebKit/Chromium x macOS/Windows)
    # Runs even when a functional e2e test failed: the fixture results are uploaded regardless.
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: pagination-fixture-*
          path: pagination-fixture
      # Tolerance (Vibeless decisions c945d094, 75522017): total pages within max(2, 1 %); chapter
      # openings within 1 page, 2 for right-hand openings. Every pair is compared (shipping pair
      # WebKit-macOS vs Chromium-Windows first); a miss on any pair fails with a diff table in the
      # job summary.
      - name: Compare page breaks across engines and OSes
        run: >-
          node scripts/compare-pagination.mjs pagination-fixture
          --require webkit-darwin,chromium-win32,chromium-darwin,webkit-win32
          --out pagination-comparison.json
      - name: Upload comparison
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pagination-comparison
          path: |
            pagination-comparison.json
            pagination-fixture/
          retention-days: 90

  perf:
    name: Perf, 100k-word manuscript (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      # The perf projects alone (--no-deps: not gated on the functional projects), one browser at a
      # time (--workers=1) so nothing else competes for the CPU while latency is measured.
      - run: pnpm exec playwright test --project=perf-chromium --project=perf-webkit --no-deps --workers=1
      - name: Perf numbers to the job summary
        if: ${{ !cancelled() }}
        run: node scripts/perf-summary.mjs
      - name: Upload performance results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: perf-results-${{ matrix.os }}
          path: perf-results/
          if-no-files-found: warn
          retention-days: 90

  tauri-build:
    name: Tauri build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Cache Typst sidecar and fonts
        uses: actions/cache@v4
        with:
          path: .cache/sidecar
          key: sidecar-${{ runner.os }}-${{ hashFiles('scripts/fetch-typst.mjs') }}
      - name: Fetch Typst sidecar and fonts
        run: node scripts/fetch-typst.mjs
      # No bundle signing: build the app binary only.
      - run: pnpm tauri build --no-bundle
      # The web bundle tauri build embedded (beforeBuildCommand `pnpm build` -> dist/) must not
      # contain the e2e-only fake Tauri backend either.
      - run: pnpm verify:prod-bundle
      # The real-app smoke (tauri-driver) is not run here: GitHub's Windows runners' WebView2 never
      # opens a DevTools port, so it could only fail (a red annotation on every run, ~95 s). It is
      # manual: .github/workflows/smoke.yml (workflow_dispatch) or locally (README, "Real-app smoke").
