name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Playwright starts its own server (no reuse) and enables retries + the HTML report.
  CI: 'true'

jobs:
  checks:
    name: Lint, typecheck, unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Production web bundle must not contain the e2e-only fake Tauri backend.
      - run: pnpm build
      - run: pnpm verify:prod-bundle

  licenses:
    name: License gate (JS + Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Every JS dependency (prod + dev) must be on the MIT-compatible allowlist.
      - name: JS licenses (pnpm licenses list + allowlist)
        run: node scripts/check-licenses.mjs
      # Rust crates: allowlist in src-tauri/deny.toml.
      - name: Rust licenses (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check licenses

  rust:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      # tauri::generate_context! embeds ../dist at compile time.
      - run: pnpm build
      - run: cargo test --locked
        working-directory: src-tauri

  e2e:
    name: Playwright e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      # Functional projects: chromium (stands in for WebView2) and webkit (for WKWebView). Perf runs
      # in its own job, so its numbers are published even when a functional test fails.
      # Includes e2e/pagination-fixture.spec.ts, which writes the cross-engine page-break JSONs
      # (perf-results/pagination-fixture-<browser>-<platform>.json) compared by the job below.
      - run: pnpm exec playwright test --project=chromium --project=webkit
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - name: Upload pagination fixture results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pagination-fixture-${{ matrix.os }}
          path: perf-results/pagination-fixture-*.json
          if-no-files-found: error
          retention-days: 90

  pagination-compare:
    name: Cross-engine page breaks (WebKit/Chromium x macOS/Windows)
    # Runs even when a functional e2e test failed: the fixture results are uploaded regardless.
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: pagination-fixture-*
          path: pagination-fixture
      # Tolerance (Vibeless decisions c945d094, 75522017): total pages within max(2, 1 %); chapter
      # openings within 1 page, 2 for right-hand openings. Every pair is compared (shipping pair
      # WebKit-macOS vs Chromium-Windows first); a miss on any pair fails with a diff table in the
      # job summary.
      - name: Compare page breaks across engines and OSes
        run: >-
          node scripts/compare-pagination.mjs pagination-fixture
          --require webkit-darwin,chromium-win32,chromium-darwin,webkit-win32
          --out pagination-comparison.json
      - name: Upload comparison
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pagination-comparison
          path: |
            pagination-comparison.json
            pagination-fixture/
          retention-days: 90

  perf:
    name: Perf, 100k-word manuscript (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      # The perf projects alone (--no-deps: not gated on the functional projects), one browser at a
      # time (--workers=1) so nothing else competes for the CPU while latency is measured.
      - run: pnpm exec playwright test --project=perf-chromium --project=perf-webkit --no-deps --workers=1
      - name: Perf numbers to the job summary
        if: ${{ !cancelled() }}
        run: node scripts/perf-summary.mjs
      - name: Upload performance results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: perf-results-${{ matrix.os }}
          path: perf-results/
          if-no-files-found: warn
          retention-days: 90

  tauri-build:
    name: Tauri build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      # No bundle signing: build the app binary only.
      - run: pnpm tauri build --no-bundle
      # The web bundle tauri build embedded (beforeBuildCommand `pnpm build` -> dist/) must not
      # contain the e2e-only fake Tauri backend either.
      - run: pnpm verify:prod-bundle
      # Real-app smoke (Windows only: tauri-driver has no macOS WKWebView driver). Informational:
      # WebView2 / msedgedriver version skew on the runner image must not fail the build.
      # msedgedriver comes preinstalled on GitHub's Windows images (EDGEWEBDRIVER).
      - name: WebView2 runtime and msedgedriver versions
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $keys = @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          )
          foreach ($k in $keys) {
            $pv = (Get-ItemProperty -Path $k -Name pv -ErrorAction SilentlyContinue).pv
            if ($pv) { Write-Output "WebView2 runtime: $pv ($k)"; break }
          }
          $driver = if ($env:EDGEWEBDRIVER) { Join-Path $env:EDGEWEBDRIVER 'msedgedriver.exe' } else { 'msedgedriver' }
          & $driver --version
      - name: Install tauri-driver (pinned)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Real-app smoke (tauri-driver + msedgedriver)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: node e2e-tauri/smoke.mjs src-tauri/target/release/novel.exe
      - name: WebView2 diagnostics (does the app start its webview on the runner?)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          "== WebView2 / Edge policies"
          foreach ($k in 'HKLM:\SOFTWARE\Policies\Microsoft\Edge', 'HKLM:\SOFTWARE\WOW6432Node\Policies\Microsoft\Edge', 'HKCU:\Software\Policies\Microsoft\Edge') {
            Get-ChildItem -Recurse $k -ErrorAction SilentlyContinue | ForEach-Object { "$($_.Name): $(($_.Property | ForEach-Object { $_ }) -join ', ')" }
            Get-ItemProperty $k -ErrorAction SilentlyContinue | Out-String -Width 300
          }
          "== env WEBVIEW2_*"; Get-ChildItem env: | Where-Object Name -like 'WEBVIEW2*' | ForEach-Object { "$($_.Name)=$($_.Value)" }
          function Probe($label, $port) {
            $p = Start-Process -FilePath 'src-tauri\target\release\novel.exe' -PassThru
            Start-Sleep -Seconds 20
            "== $($label) - app exited: $($p.HasExited)"
            Get-CimInstance Win32_Process -Filter "name='msedgewebview2.exe'" | Select-Object -First 1 |
              ForEach-Object { "browser cmd: $($_.CommandLine)" }
            try { "devtools: " + (Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:$port/json/version" -TimeoutSec 5).Content } catch { "devtools: $($_.Exception.Message)" }
            Get-Process novel, msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Seconds 2
          }
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=9333'
          Probe 'env var' 9333
          Remove-Item env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS
          # WebView2 per-app policy: AdditionalBrowserArguments keyed by the exe name.
          $pol = 'HKCU:\Software\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          New-Item -Force $pol | Out-Null
          New-ItemProperty -Force -Path $pol -Name 'novel.exe' -Value '--remote-debugging-port=9334' | Out-Null
          Probe 'registry policy' 9334
          Remove-Item -Recurse -Force 'HKCU:\Software\Policies\Microsoft\Edge\WebView2'
